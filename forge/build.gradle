plugins {
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
    id 'com.gradleup.shadow'
}

def platform = project.name;

// Function to read the last section from CHANGELOG.md
def changelog_last_section() {
    def changelogFile = rootProject.file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog available"
    }

    def content = changelogFile.text
    def sections = content.split(/(?m)(?=^# )/)

    // Return the first section (most recent) after the split
    // Remove the first empty element if it exists
    def recentSection = sections.find { it.trim().startsWith('#') }
    return recentSection ?: "No changelog available"
}

// NOTE: this mod declares NO mixins. `lne_rogues.mixins.json` (an empty config) was deleted on the
// 1.20.1 line: an empty mixin config makes Forge 47 abort at init with
// "The specified resource 'lne_rogues.mixins.json' was invalid or could not be read".
// Restore all three together when a real mixin lands: the file under common/src/main/resources,
// the `"mixins"` entry in fabric.mod.json, and a `loom { forge { mixinConfig "..." } }` block here.

architectury {
    platformSetupLoomIde()
    forge()
}

def generatedResources = project(':common').file('src/main/generated')
sourceSets {
    main {
        resources.srcDir generatedResources
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }
    // Curios (Forge accessory slots), pulled in by SpellEngine's Forge artifact
    maven { url 'https://maven.theillusivec4.top/' }

    mavenLocal()
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")

    // Ecosystem libraries from mavenLocal (published by their 1.20.1-modern ports).
    modImplementation("net.tiny_config:tiny_config-${platform}:${rootProject.tiny_config_version}") { transitive = false }
    modImplementation("net.spell_power:spell_power-${platform}:${rootProject.spell_power_version}") { transitive = false }
    modImplementation("net.spell_engine:spell_engine-${platform}:${rootProject.spell_engine_version}") { transitive = false }
    modImplementation("net.more_rpg_classes:more_rpg_library-${platform}:${rootProject.more_rpg_library_version}") { transitive = false }

    // NO Loot & Explore here: it is Fabric-only. This module is the proof that the
    // LootNExploreCompat guard keeps `common` loadable without it.

    // Rogues itself: no Java reference, but this mod extends its content.
    modLocalRuntime("net.rpg_series:rogues-${platform}:${rootProject.rogues_version}") { transitive = false }
    // Hard runtime dependency of Rogues (village barracks injection / armor sets).
    modLocalRuntime("net.foundation:structure_pool_api-${platform}:${rootProject.structure_pool_api_version}") { transitive = false }
    modLocalRuntime("net.rpg_foundation:armor_model_api-${platform}:${rootProject.armor_model_api_version}") { transitive = false }
    // Dev runtime only: supplies the `runes:crafting` recipe type More-RPG-Library's rune-altar
    // recipes use, and the `critical_strike:*` attributes it names.
    modLocalRuntime("net.rpg_series:runes-${platform}:${rootProject.runes_version}") { transitive = false }
    modLocalRuntime("net.critical_strike:critical_strike-${platform}:${rootProject.critical_strike_version}") { transitive = false }

    // Forge 47 ships plain Mixin 0.8.5; the ecosystem libraries' mixins need MixinExtras. It is JiJ'd
    // in their production jars, but Loom does not load nested jars of classpath mods, so the dev
    // runtime needs a pin. `localRuntime` keeps it out of the published POM. Never 0.4.1.
    localRuntime("io.github.llamalad7:mixinextras-forge:${rootProject.mixin_extras_version}")
    // SpellEngine's accessory integration on Forge.
    modLocalRuntime("top.theillusivec4.curios:curios-forge:${rootProject.curios_version}") { transitive = false }
    // Spell Engine hard-depends on the player animation library at runtime.
    modLocalRuntime("dev.kosmx.player-anim:player-animation-lib-forge:${rootProject.player_anim_version}")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        // Forge rejects '+<mc>' build metadata inside a version range.
        expand version: inputs.properties.version.toString().split('\\+')[0]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Publishing configuration
def releaseTypeName = (project.findProperty('release_type') ?: 'beta').toString()

// Local convenience alias -- CI invokes the per-destination publish tasks directly.
tasks.register("publishMod") {
    dependsOn(build)
    finalizedBy(tasks.named("publishMods"))
}

publishMods {
    file = remapJar.archiveFile
    changelog = providers.provider { changelog_last_section() }
    type = releaseTypeName == "release" ? me.modmuss50.mpp.ReleaseType.STABLE
            : releaseTypeName == "alpha" ? me.modmuss50.mpp.ReleaseType.ALPHA
            : me.modmuss50.mpp.ReleaseType.BETA
    version = "${project.version}-${platform}"
    displayName = "${project.version}-${platform}"
    modLoaders.add("forge")

    curseforge {
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_ID")
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        client = true
        server = true
        changelogType = "markdown"
        requires("spell-engine", "more-rpg-library", "rogues-and-warriors")
    }

    modrinth {
        environment = me.modmuss50.mpp.platforms.modrinth.ModrinthEnvironment.CLIENT_AND_SERVER
        projectId = providers.environmentVariable("MODRINTH_PROJECT_ID").orElse(providers.environmentVariable("MODRINTH_PROJECT_RAW_ID"))
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        minecraftVersions.add(project.minecraft_version)
        requires { slug = "spell-engine" }
        requires { slug = "more-rpg-library" }
        requires { slug = "rogues-and-warriors" }
    }

    github {
        repository = providers.environmentVariable("GH_OWNER")
                .zip(providers.environmentVariable("GH_REPO")) { owner, repo -> "$owner/$repo" }
        accessToken = providers.environmentVariable("GH_API_KEY")
        tagName = "${project.version}-${platform}"
        commitish = providers.environmentVariable("GITHUB_SHA")
    }
}

// GitHub release last: a failed mod upload aborts the build before the release exists.
// Ordering only -- unselected tasks are ignored. Must sit after the publishMods block.
tasks.named("publishGithub") {
    mustRunAfter(tasks.named("publishCurseforge"), tasks.named("publishModrinth"))
}
