architectury {
    common rootProject.enabled_platforms.split(',')
}

// Dummy platform for common compile
def platform = "fabric";

repositories {
    maven { url 'https://maven.kosmx.dev/' }
    maven { url 'https://maven.shedaniel.me/' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven { url 'https://maven.fabricmc.net' }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    // There is no Forgified Fabric API on the 1.20.1 line: common/ must stay Fabric-API-free.
    // Every Fabric-API-shaped call site (the whole datagen package) lives in fabric/.

    modImplementation("me.shedaniel.cloth:cloth-config-${platform}:${rootProject.cloth_config_version}")

    // Ecosystem libraries from the Modrinth maven. Modrinth serves only the per-loader jars, so
    // `common` keeps compiling against the `-fabric` flavour it already took (its dummy platform).
    modImplementation("maven.modrinth:tiny-config:${rootProject.tiny_config_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-power:${rootProject.spell_power_version}-${platform}") { transitive = false }
    modImplementation("maven.modrinth:spell-engine:${rootProject.spell_engine_version}-${platform}") { transitive = false }
    // More-RPG-Library: resolves once Fichte's release tier 1 publishes it on Modrinth.
    modImplementation("maven.modrinth:more-rpg-library:${rootProject.more_rpg_library_version}-${platform}") { transitive = false }

    // Loot & Explore is FABRIC ONLY on both game versions - there is no Forge build to depend on.
    // `modCompileOnly` so it never reaches a platform module's runtime classpath by accident; the
    // single compile-time reference (`more_rpg_loot.item.Group.RPG_LOOT_KEY`) is isolated in
    // com.lne_rogues.compat.LootNExploreCompat and only touched behind an isModLoaded() check.
    // Resolves once Fichte's release tier 2 publishes it on Modrinth.
    modCompileOnly("maven.modrinth:loot-n-explore:${rootProject.loot_n_explore_version}") { transitive = false }
}
